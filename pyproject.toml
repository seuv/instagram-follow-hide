[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-follow-privacy"
version = "0.1.0"
description = "Unofficial CLI to hide or unhide your Instagram followers/following list."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nafi' Aufa Adilla Handri" }]
keywords = ["instagram", "privacy", "cli", "followers", "following"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/seuv/instagram-follow-hide"
Issues = "https://github.com/seuv/instagram-follow-hide/issues"
Changelog = "https://github.com/seuv/instagram-follow-hide/blob/main/CHANGELOG.md"

[project.scripts]
ig-follow-privacy = "privacy:run"

[tool.setuptools]
py-modules = ["privacy"]  # the whole tool is one file

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
